# Preço por 1 milhão de tokens (USD), usado só para estimar custo na telemetria.
# A chave é exatamente o valor de LLM_FAST_MODEL / LLM_STRONG_MODEL / LLM_JUDGE_MODEL no .env.
# Modelo ausente = custo 0. Valores de out/2026 (Groq: índice Flexprice; Gemini: tabela da API do Google);
# confira a tabela do provedor antes de usar em orçamento.

"groq:openai/gpt-oss-20b":
  input_per_mtok: 0.075
  output_per_mtok: 0.30

"groq:openai/gpt-oss-120b":
  input_per_mtok: 0.15
  output_per_mtok: 0.60

"groq:qwen/qwen3.8-27b":
  input_per_mtok: 0.80
  output_per_mtok: 4.00

"google_genai:gemini-3.5-flash-lite":
  input_per_mtok: 0.30
  output_per_mtok: 2.50

"google_genai:gemini-3.8-flash":
  input_per_mtok: 0.75
  output_per_mtok: 3.75
