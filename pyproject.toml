[project]
name = "suno-content"
version = "0.1.0"
description = "Pipeline LangGraph que adapta documentos financeiros para 3 níveis x 3 formatos, com avaliador híbrido de calibração e rigor."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pymupdf>=1.24",
    "spacy>=3.8,<3.9",
    # Modelo spaCy fixado por URL para que `uv sync` reproduza o ambiente inteiro.
    "pt-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_lg-3.8.0/pt_core_news_lg-3.8.0-py3-none-any.whl",
    "textstat>=0.7.3",
    "pyyaml>=6.0",
    "pyphen>=0.14",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "rich>=13.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
# Provedores de LLM: instale só o que usar, ex.: `uv sync --extra anthropic`.
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.2"]
google = ["langchain-google-genai>=2.0"]
groq = [
    "langchain-groq>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]
docs = [
    "playwright==1.56.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not integration'"
markers = ["integration: chama a API real do LLM (rode com -m integration)"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "RUF"]
# E501: linhas longas de f-string/telemetria são deliberadas; RUF001-003: texto em português usa – e “ ”.
ignore = ["E501", "E731", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "tests"]
